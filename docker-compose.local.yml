# 本地替身环境：六项外部依赖全部可在 Docker 里启动，零账号、零公网、零密钥。
# 启动：docker compose -f docker-compose.local.yml up -d
# 停止：docker compose -f docker-compose.local.yml down
# 注意：应用本体（uvicorn）仍跑在宿主机 8000 端口，替身通过 host.docker.internal 回调它。

services:
  redis:
    image: redis:7-alpine
    container_name: ecom-local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: ecom-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom_agent
      POSTGRES_PASSWORD: ecom_agent
      POSTGRES_DB: ecom_agent
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom_agent -d ecom_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ecom-local-keycloak
    restart: unless-stopped
    command: start-dev --import-realm --http-port=8080
    environment:
      # 26.x 用 KC_BOOTSTRAP_*，24.x 用 KEYCLOAK_*，两个都给，兼容两个大版本。
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # 让 id_token 的 iss = http://localhost:8080/realms/ecom-agent，和后端配置一致。
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/local/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/realms/master >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  ollama:
    image: ollama/ollama:latest
    container_name: ecom-local-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15

  webhook-sink:
    image: python:3.13-alpine
    container_name: ecom-local-webhook
    restart: unless-stopped
    working_dir: /app
    command: ["python", "/app/local_stubs/webhook_sink.py", "--port", "8081", "--log", "/data/webhook.log"]
    ports:
      - "8081:8081"
    volumes:
      - ./scripts/local_stubs:/app/local_stubs:ro
      - stub-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-gateway:
    image: python:3.13-alpine
    container_name: ecom-local-payment
    restart: unless-stopped
    working_dir: /app
    command: >-
      python /app/local_stubs/payment_gateway_stub.py
      --port 8082
      --api-secret local-api-secret
      --callback-secret local-callback-secret
      --app-callback http://host.docker.internal:8000/api/refund/callback
      --log /data/payment.log
    ports:
      - "8082:8082"
    volumes:
      - ./scripts/local_stubs:/app/local_stubs:ro
      - stub-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  pg-data:
  ollama-data:
  stub-data:
