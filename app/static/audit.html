<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>决策审计驾驶舱 · 小奈售后</title>
<style>
  :root {
    --paper: #f2efe6; --card: #ffffff; --panel: #fbfaf6;
    --ink: #16161a; --ink-2: #46443d; --muted: #8b8677;
    --line: #e6e0d3; --line-soft: #efeade;
    --blue: #2a47c6; --blue-soft: #eef1ff;
    --green: #1f7a53; --green-soft: #e9f6ef;
    --amber: #a2701a; --amber-soft: #fdf3e0;
    --red: #b23b30; --red-soft: #fdeeec;
    --radius: 14px; --shadow: 0 1px 2px rgba(30,26,15,.04), 0 8px 24px -12px rgba(30,26,15,.18);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; }
  .top { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 28px;
    display: flex; align-items: center; gap: 16px; }
  .top h1 { margin: 0; font-size: 16px; }
  .top nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .top nav a { text-decoration: none; color: var(--ink-2); padding: 6px 12px; border-radius: 8px; font-size: 12px; }
  .top nav a.on, .top nav a:hover { background: var(--blue-soft); color: var(--blue); }
  .wrap { max-width: 1220px; margin: 24px auto; padding: 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 16px; font-size: 14px; }
  .card h2 .sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px; padding: 14px 16px; }
  .kpi b { font-size: 24px; font-variant-numeric: tabular-nums; display: block; line-height: 1.2; }
  .kpi span { color: var(--muted); font-size: 11px; }
  .kpi.good b { color: var(--green); } .kpi.warn b { color: var(--amber); } .kpi.bad b { color: var(--red); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .filters input, .filters select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; font-family: inherit; background: var(--card); }
  .filters button { padding: 7px 14px; border: 1px solid var(--blue); background: var(--blue); color: #fff;
    border-radius: 8px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .filters button.ghost { background: var(--panel); color: var(--ink-2); border-color: var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--panel); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
  .t-green { background: var(--green-soft); color: var(--green); }
  .t-amber { background: var(--amber-soft); color: var(--amber); }
  .t-red { background: var(--red-soft); color: var(--red); }
  .t-blue { background: var(--blue-soft); color: var(--blue); }
  .t-mute { background: var(--panel); color: var(--muted); }
  .note { color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 26px 10px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; margin-bottom: 9px; }
  .bar-row .lb { font-size: 12px; color: var(--ink-2); }
  .bar-track { background: var(--panel); border-radius: 8px; height: 20px; overflow: hidden; border: 1px solid var(--line-soft); }
  .bar { height: 100%; border-radius: 8px; min-width: 2px; }
  .bar-row .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  /* 详情抽屉 */
  .drawer-mask { position: fixed; inset: 0; background: rgba(20,18,12,.32); z-index: 40; display: none; }
  .drawer-mask.open { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 94vw); background: var(--paper);
    z-index: 41; transform: translateX(100%); transition: transform .25s; overflow-y: auto; box-shadow: -12px 0 32px -16px rgba(0,0,0,.3); }
  .drawer.open { transform: translateX(0); }
  .drawer .hd { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line);
    padding: 16px 22px; display: flex; align-items: center; gap: 12px; z-index: 1; }
  .drawer .hd h3 { margin: 0; font-size: 15px; }
  .drawer .hd .close { margin-left: auto; cursor: pointer; border: none; background: var(--panel); color: var(--ink-2);
    width: 30px; height: 30px; border-radius: 8px; font-size: 16px; }
  .drawer .body { padding: 18px 22px 40px; }
  .sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .sec h4 { margin: 0 0 10px; font-size: 12px; color: var(--ink-2); }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; font-size: 12px; }
  .kv .k { color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .timeline { position: relative; padding-left: 16px; }
  .timeline::before { content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
  .tl-item { position: relative; padding: 0 0 16px 8px; }
  .tl-item::before { content: ""; position: absolute; left: -15px; top: 4px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--card); border: 2px solid var(--blue); }
  .tl-item .tl-h { font-size: 12px; font-weight: 600; }
  .tl-item .tl-h small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .tl-item .tl-d { font-size: 11px; color: var(--ink-2); margin-top: 4px; line-height: 1.6; word-break: break-all; }
  pre.json { margin: 6px 0 0; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 8px 10px; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; }
</style>
</head>
<body>
<div class="top">
  <h1>决策审计驾驶舱</h1>
  <nav>
    <a href="/">客服会话</a>
    <a href="/diagnose">售后诊断</a>
    <a href="/desk">坐席工作台</a>
    <a href="/metrics">埋点漏斗</a>
    <a class="on" href="/audit">决策审计</a>
  </nav>
</div>
<div class="wrap">
  <div class="card">
    <h2>总览 <span class="sub" id="rangeLabel"></span></h2>
    <div class="filters">
      <label>从 <input type="date" id="dateFrom" /></label>
      <label>到 <input type="date" id="dateTo" /></label>
      <button id="applyBtn">应用筛选</button>
      <button id="clearBtn" class="ghost">清除</button>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="cols">
    <div class="card">
      <h2>诊断结论分布</h2>
      <div id="verdictBars"></div>
    </div>
    <div class="card">
      <h2>风险待办 <span class="sub">仍需人工关注</span></h2>
      <div id="riskBars"></div>
      <div class="note" id="riskNote"></div>
    </div>
  </div>

  <div class="card">
    <h2>决策列表 <span class="sub">点击任意一行查看完整决策链</span></h2>
    <div class="filters">
      <select id="verdictSel"><option value="">全部结论</option></select>
      <select id="executedSel">
        <option value="">全部执行状态</option>
        <option value="yes">已执行</option>
        <option value="no">未执行</option>
      </select>
      <input id="userInput" placeholder="用户 ID（可选）" />
      <button id="decisionApplyBtn">筛选</button>
      <button id="decisionClearBtn" class="ghost">清除</button>
    </div>
    <table>
      <thead><tr><th>决策 ID</th><th>结论</th><th>诉求 / 订单</th><th>条款依据</th><th>执行</th><th>时间</th></tr></thead>
      <tbody id="decisionBody"></tbody>
    </table>
    <div class="note" id="decisionNote"></div>
  </div>

  <div class="card">
    <h2>审计事件流 <span class="sub">只读 · 已脱敏 · 跨会话</span></h2>
    <div class="filters">
      <select id="groupSel">
        <option value="">全部分组</option>
        <option value="决策">决策</option>
        <option value="履约">履约</option>
        <option value="资金">资金</option>
        <option value="护栏">护栏</option>
        <option value="辅助">辅助</option>
      </select>
      <button id="eventApplyBtn">筛选</button>
    </div>
    <table>
      <thead><tr><th>时间</th><th>分组</th><th>事件</th><th>会话 / 决策</th><th>负载摘要</th></tr></thead>
      <tbody id="eventBody"></tbody>
    </table>
  </div>
</div>

<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="hd"><h3 id="drawerTitle">决策详情</h3>
    <button class="ghost" id="exportAuditHtml" style="padding:6px 10px" title="可打印报告">导出 PDF</button>
    <button class="ghost" id="exportAuditXlsx" style="padding:6px 10px" title="Excel 多工作表">导出 Excel</button>
    <button class="close" id="drawerClose">×</button>
  </div>
  <div class="body" id="drawerBody"></div>
</div>

<script>
if (new URLSearchParams(location.search).get("embed") === "1") {
  const top = document.querySelector(".top");
  if (top) top.style.display = "none";
  const wrap = document.querySelector(".wrap");
  if (wrap) wrap.style.marginTop = "18px";
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function api(path) {
  const token = localStorage.getItem("agn.staffToken") || "";
  const headers = token ? { "X-Staff-Token": token } : {};
  return fetch(path, { headers }).then(async (r) => {
    const text = await r.text();
    let data; try { data = JSON.parse(text); } catch { data = { detail: text }; }
    if (!r.ok) {
      const d = data.detail && data.detail.detail ? data.detail.detail : data.detail;
      throw new Error((d && (d.message || d)) || ("HTTP " + r.status));
    }
    return data;
  });
}
const pct = (x) => x == null ? "—" : (x*100).toFixed(1) + "%";
const verdictTag = (code, label) => {
  const cls = code === "ELIGIBLE" ? "t-green" : (code === "INELIGIBLE" || code === "ORDER_NOT_FOUND" || code === "DEGRADED") ? "t-red" : (code === "HUMAN_REVIEW") ? "t-amber" : "t-mute";
  return `<span class="tag ${cls}">${esc(label || code || "—")}</span>`;
};

function rangeParams() {
  const p = new URLSearchParams();
  if ($("dateFrom").value) p.set("from", $("dateFrom").value);
  if ($("dateTo").value) p.set("to", $("dateTo").value);
  return p;
}

async function loadOverview() {
  const p = rangeParams();
  const d = await api("/api/audit/overview?" + p);
  $("rangeLabel").textContent = (d.from || "全部") + " ~ " + (d.to || "至今");
  const ex = d.execution || {}, funds = d.funds || {}, gr = d.guardrails || {}, risks = d.risks || {};
  const kpis = [
    { n: d.total_decisions, l: "售后决策数", c: "" },
    { n: ex.executed, l: "已执行动作", c: "" },
    { n: pct(ex.rate), l: "决策执行率", c: "good" },
    { n: funds.refund_executed, l: "退款成功", c: "good" },
    { n: funds.refund_failed, l: "退款状态失败", c: funds.refund_failed ? "bad" : "" },
    { n: gr.grounding_rejected + gr.security_violation, l: "护栏拦截", c: (gr.grounding_rejected+gr.security_violation) ? "warn" : "" },
    { n: risks.total, l: "风险待办", c: risks.total ? "bad" : "good" },
    { n: d.events_total, l: "审计事件总数", c: "" },
  ];
  $("kpis").innerHTML = kpis.map(k => `<div class="kpi ${k.c}"><b>${esc(k.n)}</b><span>${esc(k.l)}</span></div>`).join("");

  const vmax = Math.max(1, ...(d.verdicts||[]).map(x=>x.count));
  $("verdictBars").innerHTML = (d.verdicts||[]).map(v => `
    <div class="bar-row"><div class="lb">${esc(v.label)}</div>
      <div class="bar-track"><div class="bar" style="width:${v.count/vmax*100}%;background:var(--blue)"></div></div>
      <div class="num">${v.count}</div></div>`).join("") || '<div class="empty">暂无决策数据</div>';

  const rmax = Math.max(1, ...((risks.by_kind)||[]).map(x=>x.count));
  $("riskBars").innerHTML = (risks.by_kind||[]).map(r => `
    <div class="bar-row"><div class="lb">${esc(r.label)}</div>
      <div class="bar-track"><div class="bar" style="width:${r.count/rmax*100}%;background:var(--amber)"></div></div>
      <div class="num">${r.count}</div></div>`).join("") || '<div class="empty">当前没有待办风险 🎉</div>';
  $("riskNote").textContent = "风险包括：退款状态失败、事实校验拦截、越权拦截、资格变化、确认失效/超时、会话账号切换、SLA 超时。点开决策详情可看完整证据链。";
}

async function loadVerdictOptions() {
  const d = await api("/api/audit/overview");
  const sel = $("verdictSel");
  (d.verdicts||[]).forEach(v => {
    const o = document.createElement("option"); o.value = v.code; o.textContent = v.label; sel.appendChild(o);
  });
}

async function loadDecisions() {
  const p = new URLSearchParams();
  if ($("verdictSel").value) p.set("verdict", $("verdictSel").value);
  if ($("executedSel").value) p.set("executed", $("executedSel").value);
  if ($("userInput").value.trim()) p.set("user_id", $("userInput").value.trim());
  if ($("dateFrom").value) p.set("from", $("dateFrom").value);
  if ($("dateTo").value) p.set("to", $("dateTo").value);
  const d = await api("/api/audit/decisions?" + p);
  $("decisionNote").textContent = `共 ${d.total} 条决策（当前显示 ${d.items.length} 条）。执行动作含建单与转人工；引用为条款依据。`;
  $("decisionBody").innerHTML = (d.items||[]).map(r => `
    <tr data-did="${esc(r.decision_id)}">
      <td style="font-family:monospace;font-size:11px">${esc(r.decision_id)}</td>
      <td>${verdictTag(r.verdict, r.verdict_label)}</td>
      <td>${esc(r.reason || "—")}<br/><span style="color:var(--muted);font-size:11px">${esc(r.order_id || "未带订单号")}</span></td>
      <td>${(r.citations||[]).map(c=>`<span class="tag t-blue">${esc(c)}</span>`).join(" ") || '<span style="color:var(--muted)">—</span>'}</td>
      <td>${r.has_execution ? `<span class="tag t-green">已执行</span>` : '<span class="tag t-mute">未执行</span>'}
        ${(r.actions||[]).map(a=>`<div style="font-size:11px;color:var(--muted)">${esc(a.action)}</div>`).join("")}</td>
      <td style="color:var(--muted);font-size:11px">${esc(r.created_at)}</td>
    </tr>`).join("") || '<tr><td colspan="6" class="empty">没有符合条件的决策</td></tr>';
  $("decisionBody").querySelectorAll("tr[data-did]").forEach(tr => {
    tr.onclick = () => openDetail(tr.getAttribute("data-did"));
  });
}

async function loadEvents() {
  const p = new URLSearchParams();
  if ($("groupSel").value) p.set("group", $("groupSel").value);
  if ($("dateFrom").value) p.set("from", $("dateFrom").value);
  if ($("dateTo").value) p.set("to", $("dateTo").value);
  p.set("limit", "80");
  const d = await api("/api/audit/events?" + p);
  $("eventBody").innerHTML = (d.items||[]).map(e => {
    const brief = Object.entries(e.payload||{}).slice(0,3).map(([k,v])=>`${k}=${typeof v === 'object' ? JSON.stringify(v).slice(0,60) : String(v).slice(0,60)}`).join(" · ");
    return `<tr><td style="color:var(--muted);font-size:11px">${esc(e.created_at)}</td>
      <td><span class="tag t-mute">${esc(e.group)}</span></td><td>${esc(e.label)}</td>
      <td style="font-family:monospace;font-size:11px">${esc(e.decision_id || e.ticket_id || e.session_id || "—")}</td>
      <td style="font-size:11px;color:var(--ink-2)">${esc(brief)}</td></tr>`;
  }).join("") || '<tr><td colspan="5" class="empty">暂无事件</td></tr>';
}

async function openDetail(did) {
  activeDecisionId = did;
  $("drawerTitle").textContent = "决策 " + did;
  $("drawerBody").innerHTML = '<div class="empty">加载中…</div>';
  $("drawerMask").classList.add("open"); $("drawer").classList.add("open");
  try {
    const d = await api("/api/audit/decisions/" + encodeURIComponent(did));
    if (!d.found) { $("drawerBody").innerHTML = '<div class="empty">未找到该决策的诊断记录</div>'; return; }
    const diag = d.diagnosis || {};
    const kv = (pairs) => pairs.map(([k,v]) => `<div class="k">${esc(k)}</div><div>${v}</div>`).join("");
    const ticket = d.ticket;
    const ticketSec = ticket ? `<div class="sec"><h4>售后工单</h4><div class="kv">${kv([
      ["工单号", esc(ticket.ticket_id)], ["状态", esc(ticket.status)], ["订单", esc(ticket.order_id)],
      ["诉求", esc(ticket.reason)], ["创建", esc(ticket.created_at)], ["更新", esc(ticket.updated_at)],
    ])}</div></div>` : "";
    const refundSec = d.refund ? `<div class="sec"><h4>退款流水</h4><div class="kv">${kv([
      ["状态", esc(d.refund.status)], ["退款单号", esc(d.refund.refund_id || "—")],
      ["金额", d.refund.amount != null ? "¥" + esc(d.refund.amount) : "—"], ["网关", esc(d.refund.gateway || "—")],
      ["操作者", esc(d.refund.operator || "—")], ["错误", esc(d.refund.error || "—")],
    ])}</div></div>` : "";
    const chain = (d.chain||[]).map(it => `
      <div class="tl-item"><div class="tl-h">${esc(it.label)} <small>${esc(it.created_at)} · ${esc(it.group)}</small></div>
        <div class="tl-d">${esc(briefOf(it.payload))}</div>
        <pre class="json">${esc(JSON.stringify(it.payload, null, 2).slice(0, 700))}</pre></div>`).join("");
    $("drawerBody").innerHTML = `
      <div class="sec"><h4>诊断结论</h4><div class="kv">${kv([
        ["结论", verdictTag(diag.verdict, diag.verdict_label)], ["诉求", esc(diag.reason || "—")],
        ["订单", esc(diag.order_id || "未带订单号")], ["用户", esc(diag.user_id || "—")],
        ["时间", esc(diag.created_at || "—")],
      ])}</div><div class="chips" style="margin-top:10px">${(diag.citations||[]).map(c=>`<span class="tag t-blue">${esc(c)}</span>`).join("") || '<span style="color:var(--muted);font-size:11px">无条款引用</span>'}</div></div>
      <div class="sec"><h4>执行动作</h4>${(d.actions||[]).map(a=>`<div style="font-size:12px;margin-bottom:4px">${esc(a.action)} · ${esc(a.state || a.ok)} <span style="color:var(--muted)">${esc(a.created_at)}</span></div>`).join("") || '<div style="color:var(--muted);font-size:11px">未执行任何动作</div>'}</div>
      ${ticketSec}${refundSec}
      <div class="sec"><h4>完整事件链（${(d.chain||[]).length}）</h4><div class="timeline">${chain || '<div class="empty">无关联事件</div>'}</div></div>
      <div class="note">本页只读。所有负载在读取时已做 PII 脱敏；决策链按 decision_id 与会话前缀聚合，缺失记录不会用推断补齐。</div>`;
  } catch (e) {
    $("drawerBody").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}
function briefOf(p) {
  if (!p) return "—";
  return Object.entries(p).filter(([k]) => !["usage","orchestration"].includes(k)).slice(0,4)
    .map(([k,v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v).slice(0,80) : String(v).slice(0,80)}`).join(" · ") || "—";
}

let activeDecisionId = "";
async function exportAudit(fmt) {
  if (!activeDecisionId) return;
  const token = localStorage.getItem("agn.staffToken") || "";
  try {
    const r = await fetch("/api/reports/audit/" + encodeURIComponent(activeDecisionId) + "?format=" + fmt,
      { headers: token ? { "X-Staff-Token": token } : {} });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || "导出失败"); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    if (fmt === "html") {
      window.open(url, "_blank");
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } else {
      const a = document.createElement("a");
      a.href = url; a.download = "决策审计报告-" + activeDecisionId + ".xlsx";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
  } catch (e) { alert("导出失败：" + e.message); }
}
$("exportAuditHtml").onclick = () => exportAudit("html");
$("exportAuditXlsx").onclick = () => exportAudit("xlsx");
$("drawerClose").onclick = () => { $("drawer").classList.remove("open"); $("drawerMask").classList.remove("open"); };
$("drawerMask").onclick = () => { $("drawer").classList.remove("open"); $("drawerMask").classList.remove("open"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("drawer").classList.remove("open"); $("drawerMask").classList.remove("open"); } });
$("applyBtn").onclick = () => { loadOverview(); loadDecisions(); loadEvents(); };
$("clearBtn").onclick = () => { $("dateFrom").value=""; $("dateTo").value=""; loadOverview(); loadDecisions(); loadEvents(); };
$("decisionApplyBtn").onclick = loadDecisions;
$("decisionClearBtn").onclick = () => { $("verdictSel").value=""; $("executedSel").value=""; $("userInput").value=""; loadDecisions(); };
$("eventApplyBtn").onclick = loadEvents;

Promise.all([loadVerdictOptions(), loadOverview(), loadDecisions(), loadEvents()]).catch(e => {
  document.querySelector(".wrap").insertAdjacentHTML("afterbegin", `<div class="card" style="border-color:var(--red)">加载失败：${esc(e.message)}。请确认已用主管或以上账号登录。</div>`);
});
</script>
